/* Layered glass and motion. Content stays on a stable, readable plane. */
@property --progress { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
.progress-wrap{perspective:900px}
.progress-orb{transform-style:preserve-3d;transform:rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));transition:transform .7s cubic-bezier(.2,.8,.2,1),--progress .85s cubic-bezier(.2,.8,.2,1);box-shadow:inset 3px 4px 6px #ffe2eab0,inset -5px -6px 8px #eed0d599,inset 11px 0 9px #51303d44,0 0 0 4px #dcb1c24d,0 24px 28px -16px #2e152b8c,0 40px 45px -24px #efafc262}
.progress-orb:before{transform:translateZ(9px);transition:background .5s}
.progress-orb:after{clip-path:none;inset:3px;border:1px solid #fff6;background:radial-gradient(ellipse at var(--light-x,25%) var(--light-y,18%),#fff9,transparent 18%),radial-gradient(ellipse at 78% 85%,#ffe7f1aa,transparent 12%);opacity:.75;transform:translateZ(14px);animation:glass-light 8s ease-in-out infinite alternate;pointer-events:none}
.orb-shell{position:absolute;inset:-3px;pointer-events:none;border-radius:50%;border:1px solid #ffe1eb99;box-shadow:inset -6px -4px 6px #ffe1f26b,inset 4px 1px 4px #fff8;transform:translateZ(5px)}
.orb-depth{position:absolute;inset:18px;border-radius:50%;pointer-events:none;border:1px solid #ffd1e336;box-shadow:inset 12px 15px 28px #40223b30,inset -7px -8px 18px #e8a2be30;transform:translateZ(-18px);background:radial-gradient(ellipse at 33% 65%,#b3c4df20,transparent 55%)}
.orb-glint{position:absolute;inset:12px;border-radius:50%;pointer-events:none;background:conic-gradient(from 25deg,transparent 0 35%,#fff0 39%,#fff9 43%,#eab7d37d 46%,transparent 51% 77%,#fff8 84%,transparent 90%);mask:radial-gradient(farthest-side,transparent 92%,#000 96%);-webkit-mask:radial-gradient(farthest-side,transparent 92%,#000 96%);transform:translateZ(18px);animation:rim-shimmer 12s ease-in-out infinite alternate}
.progress-number,.progress-total{position:relative;transform:translateZ(30px);z-index:1}
.progress-wrap{animation:orb-float 7s ease-in-out infinite}
.task{transition:background .4s,box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1);transform:perspective(800px) rotateX(var(--card-x,0deg)) rotateY(var(--card-y,0deg));box-shadow:inset 0 1px 1px #fff7,inset 0 -1px 1px #e7b6cf30,0 10px 20px -14px #30112670}
.task:before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at var(--light-x,25%) var(--light-y,0%),#fff3,transparent 60%);opacity:.55;transition:opacity .4s}
.check{transition:transform .3s cubic-bezier(.18,.9,.3,1.5),box-shadow .3s; background:radial-gradient(ellipse at var(--light-x,25%) var(--light-y,15%),#fff9,transparent 23%),radial-gradient(ellipse at 80% 84%,#f4d3e9c0,transparent 20%),radial-gradient(ellipse at 15% 75%,#b8d5d78c,transparent 25%),radial-gradient(circle at 45% 45%,#b4859b12 45%,#d4a0bd55 70%,#fff6 95%);box-shadow:inset 2px 2px 3px #f9e8f8c0,inset -3px -4px 6px #e6b6cd9c,0 7px 9px -4px #3c183967}
.check:active{transform:scale(.86) scaleX(1.08)}
.check:checked{background:#d7a6b92e}
.add-button{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.add-button:active{transform:scale(.91) rotate(8deg)}
.navbtn{transition:background .35s,box-shadow .35s,transform .35s}.navbtn.active{box-shadow:inset 0 2px 3px #fff8,inset 0 -3px 7px #d3a0bd70,0 6px 10px -4px #43243855}
.modal-backdrop:not([hidden]) .modal{animation:glass-arrive .35s cubic-bezier(.16,1,.3,1)}
.ripple.one{animation:background-drift 22s ease-in-out infinite alternate}.ripple.two{animation:background-drift 27s ease-in-out infinite alternate-reverse}
.pop{animation:membrane-pop .42s cubic-bezier(.2,.7,.3,1) forwards}
.spark{width:var(--size);height:var(--size);border:1px solid #ffe4efb3;background:radial-gradient(circle at 30% 20%,#fff,#e8b7d24d 38%,#a47b9f55 65%,#ffe0ebaa);box-shadow:inset 0 1px 2px #fff9,0 3px 5px #41203933;animation:droplet-flight var(--duration) cubic-bezier(.12,.6,.3,1) forwards}
.burst-ring{position:fixed;z-index:98;border:1px solid #ffe1efa6;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 5px #fff4,0 0 8px #f4c9df55;animation:burst-ring .65s ease-out forwards}
@media(hover:hover){.task:hover{box-shadow:inset 0 1px 2px #fff9,0 15px 25px -12px #30112660}.task:hover:before{opacity:1}.add-button:hover{transform:translateY(-2px) rotate(-5deg)}}
@keyframes glass-light{from{opacity:.55}to{opacity:.95}}
@keyframes rim-shimmer{from{rotate:-12deg;opacity:.6}to{rotate:20deg;opacity:1}}
@keyframes orb-float{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes background-drift{from{translate:0 0;scale:1}to{translate:-12px 16px;scale:1.06}}
@keyframes glass-arrive{from{opacity:0;transform:perspective(900px) translateY(25px) rotateX(-7deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes membrane-pop{0%{transform:scale(1)}23%{transform:scale(.82,1.08)}57%{transform:scale(1.23,.94);opacity:1;filter:brightness(1.3)}100%{transform:scale(1.55);opacity:0;filter:brightness(1.6)}}
@keyframes droplet-flight{0%,25%{transform:translate(-50%,-50%) scale(.35);opacity:0}30%{opacity:1}65%{opacity:.9}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@keyframes burst-ring{0%,25%{transform:translate(-50%,-50%) scale(.8);opacity:0}35%{opacity:.8}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.progress-wrap,.ripple,.progress-orb:after,.orb-glint{animation:none}.progress-orb,.task{transform:none;transition:none}.modal-backdrop:not([hidden]) .modal{animation:none}}


/* Continuous glass transitions share one slow settling curve. */
:root{--liquid-ease:cubic-bezier(.22,.75,.18,1)}
.bottom-dock{isolation:isolate}
.dock-lens{position:absolute;left:0;top:7px;height:57px;width:74px;border-radius:32px;pointer-events:none;z-index:-1;border:1px solid #f8dce578;background:linear-gradient(120deg,#f4dce37a,#cb9ebc45 50%,#f8e3ee63);box-shadow:inset 0 2px 3px #fff8,inset 0 -3px 7px #d3a0bd70,0 6px 10px -4px #43243855;transition:transform .65s var(--liquid-ease),width .65s var(--liquid-ease)}
.navbtn.active{background:transparent;border-color:transparent;box-shadow:none}.navbtn{position:relative;transition:color .6s,transform .6s var(--liquid-ease)}
.dock-lens:after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 20%,#fff5 45%,transparent 70%);background-size:250% 100%;animation:lens-flow 6s ease-in-out infinite alternate}
.task:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 20%,#fff2 42%,#f1c9df35 49%,transparent 70%);background-size:250% 100%}
.task.flowing:after{animation:glass-flow .85s var(--liquid-ease)}
.task-details{transform-origin:top center}
.progress-orb{transition:transform .85s var(--liquid-ease),--progress 1.1s var(--liquid-ease)}
.modal-backdrop:not([hidden]){animation:veil-in .45s var(--liquid-ease)}
.modal-backdrop:not([hidden]) .modal{animation:liquid-arrive .6s var(--liquid-ease)}
@keyframes lens-flow{from{background-position:100% 0;opacity:.4}to{background-position:0% 0;opacity:.85}}
@keyframes glass-flow{0%{background-position:100% 0;opacity:0}25%{opacity:.9}100%{background-position:0% 0;opacity:0}}
@keyframes veil-in{from{opacity:0}to{opacity:1}}
@keyframes liquid-arrive{from{opacity:0;filter:blur(6px);transform:translateY(18px) scale(.97,.95)}to{opacity:1;filter:blur(0);transform:none}}
@media(prefers-reduced-motion:reduce){.dock-lens{transition:none}.dock-lens:after,.task.flowing:after,.modal-backdrop:not([hidden]){animation:none}}

/* Two named sections replace the fixed icon dock. */
.app{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.section-tabs{position:relative;isolation:isolate;display:flex;padding:7px;margin:24px 7px 16px;border:1px solid #f9d7e24f;border-radius:32px;background:linear-gradient(120deg,#e4bdce44,#d1a0b51c);backdrop-filter:blur(24px)}
.section-tabs .navbtn{flex:1;min-width:0;width:auto;height:48px;font-size:15px;color:#f5e3e9}
.section-tabs .dock-lens{height:48px}

.calendar-controls #goToday{font-size:12px;padding:0 10px}
#calendarMonth{flex:1;text-align:center;font-size:14px}
.quick-panel{margin:0 7px}.quick-panel h3{font-size:20px;color:#f5e3e9}.quick-card{color:#f5e3e9}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

<body>
<div class="scene" aria-hidden="true"><div class="ripple one"></div><div class="ripple two"></div><div class="ripple three"></div><div class="float-orb one"></div><div class="float-orb two"></div><div class="float-orb three"></div></div>
<main class="app">
<header class="header"><div><div class="logo">bubble.</div><p class="date-label" id="dateLabel">Сегодня</p></div><button id="openModal" class="add-button" aria-label="Добавить дело" title="Добавить дело">+</button></header>
<nav class="section-tabs" aria-label="Разделы">
<button type="button" class="navbtn active" data-panel="home" aria-pressed="true">Сегодня</button>
<button type="button" class="navbtn" data-panel="familiar" aria-pressed="false">Знакомые дела</button>
</nav>
<section id="homePanel" aria-label="Дела по дням">
<div class="calendar-controls"><button type="button" id="prevWeek" aria-label="Предыдущая неделя">‹</button><span id="calendarMonth" aria-live="polite"></span><button type="button" id="nextWeek" aria-label="Следующая неделя">›</button><button type="button" id="goToday">Сегодня</button></div>
<div class="week-strip" id="weekStrip" aria-label="Дни недели"></div>
<div class="progress-wrap"><button type="button" id="progressOrb" class="progress-orb" style="--progress:0%" aria-label="Добавить дело" aria-haspopup="dialog" title="Добавить дело"><i class="orb-depth" aria-hidden="true"></i><i class="orb-shell" aria-hidden="true"></i><i class="orb-glint" aria-hidden="true"></i><span id="progressNumber" class="progress-number">0</span><span id="progressTotal" class="progress-total">из 0</span></button></div>
<div class="list-title"><h2 id="listHeading">Мои дела</h2><span id="counter">0 из 0</span></div>
<section class="tasks" id="tasks" aria-label="Список дел"></section>
</section>
<section class="quick-panel glass" id="quickPanel" hidden></section>
<p class="footer">Каждое маленькое дело заслуживает своего пузырька ♡</p>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>

<div id="modalBackdrop" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="modal-eyebrow">bubble. ✧</span><h2 id="modalTitle">Новое дело</h2></div><button type="button" class="close-modal" id="closeModal" aria-label="Закрыть">×</button></div>
<form id="newTask"><label class="field-label" for="taskInput">Что хочется сделать?</label><input class="modal-input" id="taskInput" maxlength="180" placeholder="Например, помыть голову" autocomplete="off" required>
<div class="modal-step-title">Шаги <span>по желанию</span></div><div id="draftSteps" class="draft-steps"></div><div class="draft-row"><input id="draftStepInput" maxlength="150" placeholder="Добавить небольшой шаг"><button id="addDraftStep" type="button" aria-label="Добавить шаг">+</button></div>
<div class="modal-actions"><button type="button" class="cancel-btn" id="cancelModal">Отмена</button><button class="save-btn" type="submit">Сохранить</button></div></form></section></div>
<script>
(()=>{'use strict';
const KEY='little-things-v1', $=id=>document.getElementById(id), dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), nowKey=()=>dateKey(new Date()),dateFromKey=k=>new Date(k+'T12:00:00'),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);
let items=[];try{const existing=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(existing))items=existing.filter(x=>x&&typeof x.title==='string')}catch(e){}
let selected=nowKey(),panel='home',expanded=new Set(),draftSteps=[];
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('Не получилось сохранить данные в браузере. Проверь свободное место и настройки Safari.')}};
function currentItems(){return selected===nowKey()?items.filter(x=>(!x.done&&x.date<=selected)||x.date===selected):items.filter(x=>x.date===selected)}
function fmtDate(k){const d=dateFromKey(k),same=k===nowKey();return (same?'Сегодня, ':'')+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function addTask(title,steps=[],date=selected,refresh=true){const t=title.trim();if(!t)return;items.unshift({id:uid(),title:t,date,done:false,steps:steps.map(s=>({title:s,done:false}))});save();if(refresh)render()}
function pop(node,callback){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){callback();return}
  const rect=node.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2;
  node.disabled=true;
  node.classList.add('pop');
  const ring=el('i','burst-ring');
  Object.assign(ring.style,{left:x+'px',top:y+'px',width:rect.width+'px',height:rect.height+'px'});
  document.body.append(ring);
  setTimeout(()=>ring.remove(),700);
  for(let i=0;i<12;i++){
    const drop=el('i','spark'),angle=i*Math.PI*2/12,travel=rect.width*(.65+Math.random()*.65);
    drop.style.left=x+'px';drop.style.top=y+'px';
    drop.style.setProperty('--dx',Math.cos(angle)*travel+'px');
    drop.style.setProperty('--dy',Math.sin(angle)*travel+18+'px');
    drop.style.setProperty('--size',3+Math.random()*6+'px');
    drop.style.setProperty('--duration',600+Math.random()*220+'ms');
    document.body.append(drop);setTimeout(()=>drop.remove(),900);
  }
  setTimeout(callback,420);
}

function renderWeek(){$('calendarMonth').textContent=dateFromKey(selected).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});$('goToday').disabled=selected===nowKey();const day=dateFromKey(selected),dayOfWeek=(day.getDay()+6)%7,monday=new Date(day);monday.setDate(day.getDate()-dayOfWeek);const strip=$('weekStrip');strip.replaceChildren();const short=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const key=dateKey(d),btn=el('button','day'+(key===selected?' active':''));btn.type='button';btn.setAttribute('aria-label',d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}));btn.setAttribute('aria-pressed',String(key===selected));btn.append(el('span','',short[i]),el('b','',String(d.getDate())));btn.onclick=()=>{selected=key;panel='home';render()};strip.append(btn)}}
function renderTasks(){const host=$('tasks');host.replaceChildren();const list=currentItems(),done=list.filter(x=>x.done).length;$('counter').textContent=done+' из '+list.length;$('progressNumber').textContent=done;$('progressTotal').textContent='из '+list.length;$('progressOrb').style.setProperty('--progress',(list.length?done/list.length*100:0)+'%');$('progressOrb').setAttribute('aria-label','Добавить дело. Выполнено '+done+' из '+list.length);
if(!list.length){const empty=el('div','empty glass');empty.append(el('strong','','Пока здесь свободно 🫧'),el('p','','Добавь маленькое дело кнопкой +'));host.append(empty);return}
for(const item of list){const card=el('article','task glass'+(item.done?' done':'')),head=el('div','taskhead'),check=el('input','check');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Вернуть дело: ':'Лопнуть пузырёк: ')+item.title);check.onchange=()=>{if(check.checked)pop(check,()=>{item.done=true;save();render()});else{item.done=false;save();render()}};const content=el('div','task-name'),title=el('span','tasktitle',item.title);content.append(title);const steps=Array.isArray(item.steps)?item.steps:(item.steps=[]);if(steps.length)content.append(el('span','task-meta',steps.length+' '+(steps.length===1?'шаг':steps.length<5?'шага':'шагов')+' · '+steps.filter(s=>s.done).length+' сделано'));
card.dataset.taskId=item.id;head.append(check,content);const toggle=el('button','disclosure','›');toggle.type='button';toggle.setAttribute('aria-label','Открыть шаги и действия');toggle.setAttribute('aria-expanded',String(expanded.has(item.id)));toggle.onclick=()=>{if(expanded.has(item.id))expanded.delete(item.id);else expanded.add(item.id);render()};head.append(toggle);card.append(head);
if(expanded.has(item.id)){const details=el('div','task-details');if(steps.length){const stepList=el('div','steps');for(const s of steps){const row=el('label','step'+(s.done?' finished':'')),c=el('input','check');c.type='checkbox';c.checked=!!s.done;c.setAttribute('aria-label',(s.done?'Вернуть шаг: ':'Лопнуть шаг: ')+s.title);c.onchange=()=>{if(c.checked)pop(c,()=>{s.done=true;save();render()});else{s.done=false;save();render()}};row.append(c,el('span','',s.title));stepList.append(row)}details.append(stepList)}
const actions=el('div','actions'),add=el('button','soft','＋ Добавить шаг');add.type='button';add.onclick=()=>{const old=details.querySelector('.stepform');if(old){old.remove();return}const form=el('form','stepform'),inp=el('input');inp.placeholder='Небольшой шаг';inp.required=true;inp.maxLength=150;const ok=el('button','','Добавить');ok.type='submit';form.append(inp,ok);form.onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t){steps.push({title:t,done:false});item.suggestedSteps=false;save();render()}};details.append(form);inp.focus()};actions.append(add);
if(!steps.length){const suggest=el('button','soft','✧ Помочь разбить на шаги');suggest.type='button';suggest.onclick=()=>{const t=item.title.toLowerCase();let v;if(/голов|волос|душ|мытьс/.test(t))v=['Приготовить полотенце','Собрать средства','Помыть волосы','Высушить волосы'];else if(/посуд/.test(t))v=['Подойти к раковине','Убрать лишнее','Помыть несколько предметов'];else if(/убор|прибра|комнат/.test(t))v=['Выбрать одну зону','Убрать три вещи','Протереть поверхность'];else v=['Подготовить нужное','Сделать первый шаг','Продолжить, если есть силы'];item.steps=v.map(title=>({title,done:false}));item.suggestedSteps=true;save();render()};actions.append(suggest)}
if(item.suggestedSteps&&steps.length){const undo=el('button','soft','× Убрать предложенные шаги');undo.type='button';undo.onclick=()=>{item.steps=[];item.suggestedSteps=false;save();render()};actions.append(undo)}
const del=el('button','soft','Удалить дело');del.type='button';del.onclick=()=>{if(confirm('Удалить дело «'+item.title+'»?')){items=items.filter(x=>x.id!==item.id);expanded.delete(item.id);save();render()}};actions.append(del);details.append(actions);card.append(details)}host.append(card)}
}
function renderPanel(){
const box=$('quickPanel');box.replaceChildren();box.hidden=panel==='home';$('homePanel').hidden=panel!=='home';if(panel==='home')return;
box.append(el('h3','','Знакомые дела'),el('p','','Нажми на рекомендацию — она сразу появится в делах на сегодня.'));
const counts=new Map();
for(const item of items){const key=item.title.trim().toLocaleLowerCase('ru-RU');if(!key)continue;const entry=counts.get(key)||{title:item.title,count:0};entry.count++;counts.set(key,entry)}
const recommendations=[...counts.values()].sort((a,b)=>b.count-a.count).slice(0,8).map(x=>x.title);
const seen=new Set(recommendations.map(t=>t.toLocaleLowerCase('ru-RU')));
for(const title of ['Помыть голову','Разобрать посуду','Пройти урок QA','Сделать брелок','Полить цветы','Убраться 10 минут']){if(!seen.has(title.toLocaleLowerCase('ru-RU')))recommendations.push(title)}
const grid=el('div','quick-grid');
for(const title of recommendations){const button=el('button','quick-card',title);button.type='button';const exists=items.some(x=>!x.done&&x.date<=nowKey()&&x.title.trim().toLocaleLowerCase('ru-RU')===title.trim().toLocaleLowerCase('ru-RU'));button.append(el('small','',exists?'Уже в делах на сегодня':'＋ Добавить на сегодня'));button.disabled=exists;button.onclick=()=>{addTask(title,[],nowKey(),false);button.disabled=true;button.querySelector('small').textContent='Уже в делах на сегодня';$('announcement').textContent='Добавлено на сегодня: '+title};grid.append(button)}
box.append(grid);
}
function render(){
const previousCards=new Map([...document.querySelectorAll('.task')].map(card=>[card.dataset.taskId,{rect:card.getBoundingClientRect(),expanded:!!card.querySelector('.task-details'),done:card.classList.contains('done')}]));
const previousPanel=$('quickPanel').textContent;
const previousDate=$('dateLabel').textContent;
const d=dateFromKey(selected);$('dateLabel').textContent=fmtDate(selected);$('listHeading').textContent=selected===nowKey()?'Мои дела':'Дела на '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});renderWeek();renderTasks();renderPanel();document.querySelectorAll('.navbtn').forEach(b=>{const active=b.dataset.panel===panel;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});animateRender(previousCards,previousPanel,previousDate);moveLens()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;if(panel==='home')selected=nowKey();render()});
function changeWeek(offset){const d=dateFromKey(selected);d.setDate(d.getDate()+offset*7);selected=dateKey(d);render()}
$('prevWeek').onclick=()=>changeWeek(-1);$('nextWeek').onclick=()=>changeWeek(1);$('goToday').onclick=()=>{selected=nowKey();render()};
const backdrop=$('modalBackdrop');function renderDraft(){const host=$('draftSteps');host.replaceChildren();draftSteps.forEach((t,i)=>{const row=el('div','draft-step'),b=el('button','','×');b.type='button';b.setAttribute('aria-label','Удалить шаг');b.onclick=()=>{draftSteps.splice(i,1);renderDraft()};row.append(el('span','',t),b);host.append(row)})}
let modalTrigger=null;
function openModal(){modalTrigger=document.activeElement;if(panel!=='home'){selected=nowKey();panel='home';render()}draftSteps=[];renderDraft();$('taskInput').value='';$('draftStepInput').value='';backdrop.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('taskInput').focus(),60)}
let modalExit=null;
function closeModal(){
  if(backdrop.hidden||modalExit)return;
  const finish=()=>{backdrop.hidden=true;document.body.style.overflow='';(modalTrigger||$('openModal')).focus();modalExit=null};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!backdrop.animate){finish();return}
  modalExit=backdrop.animate([{opacity:1},{opacity:0}],{duration:280,easing:'ease-out'});
  backdrop.querySelector('.modal').animate([{transform:'none',filter:'blur(0)'},{transform:'translateY(12px) scale(.98)',filter:'blur(4px)'}],{duration:280,easing:'ease-out'});
  modalExit.onfinish=finish;
}
function addDraft(){const inp=$('draftStepInput'),v=inp.value.trim();if(v){draftSteps.push(v);inp.value='';renderDraft();inp.focus()}}
$('openModal').onclick=openModal;$('progressOrb').onclick=openModal;$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('addDraftStep').onclick=addDraft;$('draftStepInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addDraft()}};backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.hidden)closeModal()});
$('newTask').onsubmit=e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title)return;const extra=$('draftStepInput').value.trim();if(extra)draftSteps.push(extra);addTask(title,draftSteps);closeModal();panel='home';render()};
const liquidTiming={duration:650,easing:'cubic-bezier(.22,.75,.18,1)'};
const dock=document.querySelector('.section-tabs'),lens=el('i','dock-lens');
lens.setAttribute('aria-hidden','true');dock.prepend(lens);
function moveLens(){
  const active=dock.querySelector('.navbtn.active');
  lens.style.width=active.offsetWidth+'px';lens.style.transform='translateX('+active.offsetLeft+'px)';
}
new ResizeObserver(moveLens).observe(dock);
function meltIn(node){
  node.animate([{opacity:0,filter:'blur(4px)',translate:'0 7px'},{opacity:1,filter:'blur(0)',translate:'0 0'}],liquidTiming);
}
function animateRender(previousCards,previousPanel,previousDate){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!Element.prototype.animate)return;
  document.querySelectorAll('.task').forEach(card=>{
    const old=previousCards.get(card.dataset.taskId),rect=card.getBoundingClientRect();
    if(!old){meltIn(card);return}
    if(Math.abs(old.rect.height-rect.height)>1){
      const heightAnimation=card.animate([{height:old.rect.height+'px',overflow:'hidden'},{height:rect.height+'px',overflow:'hidden'}],liquidTiming);
      // Height interpolation already moves subsequent cards through normal layout.
      card.classList.add('flowing');
      heightAnimation.onfinish=()=>card.classList.remove('flowing');
    }
    const details=card.querySelector('.task-details');
    if(details&&!old.expanded)meltIn(details);
    if(old.done!==card.classList.contains('done'))card.classList.add('flowing');
  });
  if(previousPanel!==$('quickPanel').textContent&&!$('quickPanel').hidden)meltIn($('quickPanel'));
  if(previousDate!==$('dateLabel').textContent)meltIn($('dateLabel'));
}
// Pointer lighting is restricted to fine pointers and respects reduced motion.
const motionAllowed=matchMedia('(prefers-reduced-motion: reduce)'),finePointer=matchMedia('(hover: hover) and (pointer: fine)');
let litSurface=null,lightFrame=0;
function clearLight(){
  if(!litSurface)return;
  ['--tilt-x','--tilt-y','--card-x','--card-y','--light-x','--light-y'].forEach(key=>litSurface.style.removeProperty(key));
  litSurface=null;
}
document.addEventListener('pointermove',event=>{
  if(motionAllowed.matches||!finePointer.matches)return;
  const surface=event.target.closest('.progress-orb,.task');
  if(surface!==litSurface){cancelAnimationFrame(lightFrame);clearLight();litSurface=surface}
  if(!surface)return;
  cancelAnimationFrame(lightFrame);
  lightFrame=requestAnimationFrame(()=>{
    const rect=surface.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
    surface.style.setProperty('--light-x',x*100+'%');surface.style.setProperty('--light-y',y*100+'%');
    surface.style.setProperty('--tilt-x',(0.5-y)*12+'deg');surface.style.setProperty('--tilt-y',(x-.5)*12+'deg');
    surface.style.setProperty('--card-x',(.5-y)*3+'deg');surface.style.setProperty('--card-y',(x-.5)*3+'deg');
  });
},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{cancelAnimationFrame(lightFrame);clearLight()});
motionAllowed.addEventListener('change',()=>{cancelAnimationFrame(lightFrame);clearLight()});
render();
})();
</script>
</body></html>
