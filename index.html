<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>bubble. — маленькие дела</title>
<style>
:root{color-scheme:light;--ink:#fff9ff;--muted:#f4e7ffdc;--dark:#473f61;--line:#ffffff8a;--edge:#ffffffc9;--shadow:#66559a32;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:#988abf}
body{margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;background:linear-gradient(134deg,#c9a9db 0%,#b6a5d8 19%,#8f88bb 53%,#9aabd6 78%,#a8a2d4 100%)}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.46;cursor:default}

[hidden]{display:none!important}

.scene:before{content:"";position:absolute;inset:-14%;background:radial-gradient(ellipse at 20% 12%,#fbe1ffb4,transparent 37%),radial-gradient(ellipse at 80% 10%,#c6ddffb8,transparent 28%),radial-gradient(ellipse at 5% 70%,#eab2f9aa,transparent 33%),radial-gradient(ellipse at 85% 90%,#96c7e6b0,transparent 34%);filter:blur(20px)}
.ripple{position:absolute;border-radius:48% 52% 56% 44%/56% 42% 58% 44%;border:1px solid #ffffffbd;box-shadow:inset 8px 9px 13px #ffffffa4,inset -14px -11px 22px #8ba2eb8a,0 8px 18px #ffffff32,0 0 2px #fff;transform:rotate(-27deg);background:linear-gradient(125deg,#ffffff9c 2%,#c3c8ff38 27%,#ffffff08 45%,#c7f2ff91 70%,#ffa9f166 89%,#ffffffbf)}
.ripple.one{width:390px;height:140px;left:-160px;top:25%;transform:rotate(-32deg)}
.ripple.two{width:490px;height:156px;right:-280px;top:3%;transform:rotate(37deg)}
.ripple.three{width:520px;height:130px;right:-260px;bottom:5%;transform:rotate(-24deg)}
.float-orb{position:absolute;border-radius:50%;border:1px solid #fffafacc;background:radial-gradient(circle at 27% 18%,#fff9 0%,#ffffff18 16%,transparent 43%),radial-gradient(circle at 79% 84%,#ffb6f58c,transparent 48%),radial-gradient(circle at 22% 75%,#9ce9ff94,transparent 55%),linear-gradient(140deg,#ffffff55,#9686d251);box-shadow:inset 4px 4px 9px #ffffffc9,inset -6px -7px 12px #746ab071,0 7px 22px #6a55983b}
.float-orb.one{width:96px;height:96px;right:-16px;top:38%}.float-orb.two{width:49px;height:49px;left:7%;top:57%}.float-orb.three{width:170px;height:170px;right:-85px;bottom:14%}
.app{position:relative;z-index:1;max-width:520px;min-height:100svh;margin:0 auto;padding:calc(45px + env(safe-area-inset-top,0px)) 19px calc(128px + env(safe-area-inset-bottom,0px));background:linear-gradient(155deg,#ffffff18,#7776b20b 38%,#e0dcfa10);border-inline:1px solid #ffffff42}
@media(min-width:650px){.app{margin:25px auto;min-height:calc(100vh - 50px);border:1px solid #ffffff66;border-radius:48px;box-shadow:0 20px 75px #6250804a;overflow:hidden}}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.logo{font-family:"Iowan Old Style","Baskerville","Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(53px,13vw,74px);line-height:.95;letter-spacing:-3.3px;text-shadow:0 2px 12px #ffffff40}.date-label{margin:13px 0 0;font-size:18px;font-weight:400;text-shadow:0 1px 9px #65588036}
.add-button{width:74px;height:74px;flex:0 0 74px;display:grid;place-items:center;border-radius:50%;font-size:45px;font-weight:200;padding:0 0 6px;line-height:1;background:radial-gradient(circle at 30% 14%,#ffffff9b,transparent 34%),radial-gradient(circle at 77% 85%,#d99afa80,transparent 43%),linear-gradient(135deg,#ffffff7e,#9a96d65e 62%,#ccdcff87);border:1px solid #ffffffcf;box-shadow:inset 2px 3px 8px #fff9,inset -5px -5px 12px #7b6bc093,0 7px 16px #57417b52,0 0 0 1px #ffffff29}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:24px}
.day{min-width:0;border-radius:22px;padding:10px 0 9px;display:flex;align-items:center;flex-direction:column;gap:4px;background:#ffffff19;border:1px solid #ffffff50;box-shadow:inset 1px 1px 2px #ffffff4a;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f8f3ff;font-size:13px}
.day b{font-size:19px;font-weight:400}.day.active{color:#46405e;background:radial-gradient(circle at 27% 4%,#ffffff,#f4e7fff5 45%,#dfd7f3e6);box-shadow:inset 0 2px 5px #fff,0 3px 18px #f2e3ffb3;border-color:#fff}
.progress-wrap{display:grid;place-items:center;margin:20px 0 20px;min-height:238px}
.progress-orb{position:relative;width:clamp(205px,58vw,250px);height:clamp(205px,58vw,250px);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;isolation:isolate;background:radial-gradient(circle at 19% 20%,#fff9 0%,#ffffff18 17%,transparent 36%),radial-gradient(circle at 18% 78%,#8dffffaa,transparent 32%),radial-gradient(circle at 84% 81%,#ffaaf9a8,transparent 38%),radial-gradient(ellipse at 65% 22%,#dfe2ff46,transparent 58%),linear-gradient(145deg,#fefaff38,#8a82c64f 45%,#f8caff33);border:2px solid #fffd;box-shadow:inset 5px 6px 13px #ffffffc7,inset -14px -16px 26px #8b7ac78c,0 12px 40px #765ca356,0 0 0 3px #fef9ff3b,0 0 34px #d7c4ff79}
.progress-orb:before{content:"";position:absolute;inset:10px;border-radius:50%;background:conic-gradient(from 0deg,#ffffffee 0 var(--progress),#ffffff24 var(--progress) 100%);-webkit-mask:radial-gradient(circle,transparent calc(50% - 5px),black calc(50% - 4px),black calc(50% + 1px),transparent calc(50% + 3px));mask:radial-gradient(circle,transparent calc(50% - 5px),black calc(50% - 4px),black calc(50% + 1px),transparent calc(50% + 3px));filter:drop-shadow(0 0 4px #fff)}
.progress-orb:after{content:"";position:absolute;inset:9px;border-radius:50%;border-top:8px solid #ffffffce;border-left:2px solid #ffffff5c;transform:rotate(28deg);clip-path:polygon(40% 0,100% 0,100% 45%,55% 20%)}
.progress-number{font-family:"Iowan Old Style","Times New Roman",serif;font-weight:400;font-size:79px;line-height:1;text-shadow:0 2px 12px #fff7}.progress-total{font-size:20px;margin-top:9px;text-shadow:0 2px 12px #ffffff66}
.list-title{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px}.list-title h2{font-size:14px;letter-spacing:.3px;font-weight:500;margin:0}.list-title span{font-size:12px;color:#f9eaffdb}
.tasks{display:grid;gap:10px}
.glass{position:relative;background:linear-gradient(135deg,#ffffff4d 0%,#ffffff25 45%,#e6e4ff37 100%);border:1px solid #ffffffb4;box-shadow:inset 1px 2px 2px #fff9,inset -1px -2px 4px #d6b3fc33,0 6px 22px #65548b2a;backdrop-filter:blur(26px) saturate(165%);-webkit-backdrop-filter:blur(26px) saturate(165%);border-radius:28px}
.task{padding:13px 14px 13px 12px}.taskhead{display:flex;align-items:center;gap:13px;min-height:52px}
.check{appearance:none;-webkit-appearance:none;display:grid;place-items:center;position:relative;cursor:pointer;flex:0 0 48px;width:48px;height:48px;border-radius:50%;border:1px solid #ffffffee;background:radial-gradient(circle at 28% 15%,#ffffffeb 0%,#ffffff36 11%,transparent 35%),radial-gradient(circle at 80% 82%,#fea8f69c,transparent 42%),radial-gradient(circle at 20% 75%,#95dffff2,transparent 42%),linear-gradient(140deg,#e5d2ff80,#8e86c75c 58%,#d2d9ff85);box-shadow:inset 3px 4px 7px #ffffffbf,inset -5px -5px 9px #6e6ca968,0 3px 8px #6151846b;transition:transform .2s,opacity .25s}
.check:hover{transform:scale(1.07)}.check:checked{background:radial-gradient(circle at 38% 22%,#ffffffc0,transparent 42%),linear-gradient(145deg,#e2ccf8,#a68ecc 60%,#8abbeb);box-shadow:inset 2px 2px 8px #fff,0 0 13px #e7e2ffad}
.check:checked:after{content:"✓";color:white;font-size:30px;font-weight:600;text-shadow:0 1px 4px #625282}
.task-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.tasktitle{font-size:17px;line-height:1.22;overflow-wrap:anywhere}.task-meta{font-size:12px;color:#f5e9ffb9}.task.done .tasktitle{text-decoration:line-through;text-decoration-thickness:1px;opacity:.65}.task.done{background:linear-gradient(135deg,#ffffff23,#ffffff11)}
.disclosure{flex:0 0 29px;width:29px;height:35px;background:transparent;font-size:25px;line-height:1;color:#fffc;display:grid;place-items:center;border-radius:11px}
.disclosure[aria-expanded="true"]{transform:rotate(90deg)}.delete-btn{font-size:20px;border-radius:50%;background:#ffffff1f;width:25px;height:25px;color:#fff9;display:grid;place-items:center}
.task-details{padding:12px 1px 4px 61px;border-top:1px solid #ffffff48;margin-top:10px}
.steps{display:grid;gap:12px}.step{display:flex;gap:11px;align-items:center;min-height:30px;font-size:14px;color:#fff;line-height:1.4}.step.finished span{text-decoration:line-through;opacity:.7}.step .check{width:27px;height:27px;flex-basis:27px}.step .check:checked:after{font-size:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.soft{font-size:12px;border-radius:12px;background:#ffffff35;border:1px solid #ffffff82;padding:9px 11px}
.stepform{display:flex;gap:7px;margin-top:10px}.stepform input{min-width:0;flex:1;background:#ffffff8c;border:1px solid #fff;border-radius:12px;padding:10px;color:#4e4566;font-size:14px}.stepform button{background:#ffffff64;border-radius:12px;padding:8px;font-size:12px}
.empty{padding:25px;text-align:center;line-height:1.5}.empty strong{display:block;margin-bottom:6px}.empty p{margin:0;font-size:13px}
[hidden]{display:none!important}
.quick-panel{margin-top:17px;padding:17px}.quick-panel h3{margin:0 0 10px;font-size:15px}.quick-panel p{font-size:13px;line-height:1.5;color:#fffdf4;margin:0 0 11px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-card{text-align:left;border-radius:17px;padding:13px 11px;background:#ffffff35;border:1px solid #ffffff85;min-height:74px;line-height:1.3;font-size:14px}.quick-card small{display:block;font-size:11px;opacity:.72;margin-top:6px}
.bottom-dock{position:fixed;z-index:8;bottom:calc(13px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 38px);max-width:480px;display:flex;justify-content:space-around;align-items:center;padding:9px;border-radius:30px;background:linear-gradient(140deg,#ffffff63,#e0e6ff38);border:1px solid #fff9;box-shadow:inset 1px 2px 3px #fff9,0 8px 25px #6354804d;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.navbtn{width:54px;height:54px;border-radius:20px;background:transparent;display:grid;place-items:center}.navbtn.active{background:radial-gradient(circle at 27% 18%,#ffffffa6,transparent 38%),linear-gradient(145deg,#ffffff75,#c4b5f580);border:1px solid #ffffffb0;box-shadow:inset 0 2px 4px #ffffffad,0 2px 8px #897ab970}.navbtn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.modal-backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#47395c60;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.modal{max-height:88dvh;overflow:auto;width:min(100%,460px);padding:24px;border-radius:31px;color:#483f60;background:linear-gradient(145deg,#fff5ffec,#ddd2f3eb 65%,#d3dcf3df);border:1px solid #fff;box-shadow:0 25px 75px #3e315a68,inset 2px 2px 4px #fff}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:20px}.modal-head h2{font-size:26px;letter-spacing:-.8px;margin:4px 0 0}.modal-eyebrow{font-size:12px;color:#837696}.close-modal{color:#695d7e;background:#ffffffa8;width:35px;height:35px;border-radius:13px;font-size:26px}
.field-label{display:block;font-size:13px;margin:13px 0 9px;font-weight:600}.modal-input,.draft-row input{width:100%;min-width:0;padding:14px;border-radius:16px;border:1px solid white;background:#ffffff92;color:#4c4464;outline-color:#987bb5}.modal-input::placeholder,.draft-row input::placeholder{color:#a89db4}
.modal-step-title{font-size:14px;font-weight:600;margin:25px 0 10px}.modal-step-title span{font-weight:400;opacity:.65;font-size:12px}.draft-row{display:flex;gap:8px}.draft-row input{flex:1}.draft-row button{flex:0 0 45px;border-radius:14px;background:#ffffff9b;color:#756185;font-size:25px}
.draft-steps{display:grid;gap:7px}.draft-step{display:flex;align-items:center;gap:10px;border-radius:12px;background:#ffffff73;padding:9px 11px;font-size:13px}.draft-step span{flex:1}.draft-step button{color:#78678b;background:transparent;font-size:20px}
.modal-actions{display:flex;gap:9px;margin-top:25px}.modal-actions button{flex:1;border-radius:16px;padding:14px 5px;font-size:14px}.cancel-btn{background:#ffffffa3;color:#695979}.save-btn{background:linear-gradient(140deg,#ab94ca,#807bad);color:white}
.pop{animation:pop .32s ease-out forwards;pointer-events:none}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35);filter:brightness(1.25)}100%{transform:scale(1.8);opacity:0}}
.spark{position:fixed;z-index:99;pointer-events:none;width:7px;height:7px;border:1px solid #fff;border-radius:50%;background:#f6d2ff;box-shadow:0 0 8px #fff;animation:spark .52s ease-out forwards}@keyframes spark{to{transform:rotate(var(--a)) translateX(31px) scale(.3);opacity:0}}
.footer{margin:20px 3px;color:#f2e9ffd9;text-align:center;font-size:12px}
@media(min-width:650px){.bottom-dock{bottom:40px}}
@media(max-width:365px){.app{padding-left:12px;padding-right:12px}.logo{font-size:54px}.week-strip{gap:4px}.day{border-radius:17px}.tasktitle{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="ripple one"></div><div class="ripple two"></div><div class="ripple three"></div><div class="float-orb one"></div><div class="float-orb two"></div><div class="float-orb three"></div></div>
<main class="app">
<header class="header"><div><div class="logo">bubble.</div><p class="date-label" id="dateLabel">Сегодня</p></div><button id="openModal" class="add-button" aria-label="Добавить дело" title="Добавить дело">+</button></header>
<div class="week-strip" id="weekStrip" aria-label="Дни недели"></div>
<div class="progress-wrap"><div id="progressOrb" class="progress-orb" style="--progress:0%" role="img" aria-label="Прогресс выполнения"><span id="progressNumber" class="progress-number">0</span><span id="progressTotal" class="progress-total">из 0</span></div></div>
<div class="list-title"><h2 id="listHeading">Мои дела</h2><span id="counter">0 из 0</span></div>
<section class="tasks" id="tasks" aria-label="Список дел"></section>
<section class="quick-panel glass" id="quickPanel" hidden></section>
<p class="footer">Каждое маленькое дело заслуживает своего пузырька ♡</p>
</main>
<nav class="bottom-dock" aria-label="Разделы">
<button class="navbtn active" data-panel="home" title="Дела" aria-label="Дела"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18M7 14h2M12 14h2M7 18h2"/></svg></button>
<button class="navbtn" data-panel="quick" title="Быстрые дела" aria-label="Быстрые дела"><svg viewBox="0 0 24 24"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2ZM19 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2Z"/></svg></button>
<button class="navbtn" data-panel="stats" title="Статистика" aria-label="Статистика"><svg viewBox="0 0 24 24"><path d="M4 20V12h4v8M10 20V7h4v13M16 20V3h4v17M2 21h20"/></svg></button>
<button class="navbtn" data-panel="templates" title="Шаблоны" aria-label="Шаблоны"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
<button class="navbtn" data-panel="settings" title="Настройки и данные" aria-label="Настройки и данные"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4 12H2M22 12h-2M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"/><circle cx="12" cy="12" r="5"/></svg></button>
</nav>
<div id="modalBackdrop" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="modal-eyebrow">bubble. ✧</span><h2 id="modalTitle">Новое дело</h2></div><button type="button" class="close-modal" id="closeModal" aria-label="Закрыть">×</button></div>
<form id="newTask"><label class="field-label" for="taskInput">Что хочется сделать?</label><input class="modal-input" id="taskInput" maxlength="180" placeholder="Например, помыть голову" autocomplete="off" required>
<div class="modal-step-title">Шаги <span>по желанию</span></div><div id="draftSteps" class="draft-steps"></div><div class="draft-row"><input id="draftStepInput" maxlength="150" placeholder="Добавить небольшой шаг"><button id="addDraftStep" type="button" aria-label="Добавить шаг">+</button></div>
<div class="modal-actions"><button type="button" class="cancel-btn" id="cancelModal">Отмена</button><button class="save-btn" type="submit">Сохранить</button></div></form></section></div>
<script>
(()=>{'use strict';
const KEY='little-things-v1', $=id=>document.getElementById(id), dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), nowKey=()=>dateKey(new Date()),dateFromKey=k=>new Date(k+'T12:00:00'),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);
let items=[];try{const existing=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(existing))items=existing.filter(x=>x&&typeof x.title==='string')}catch(e){}
let selected=nowKey(),panel='home',expanded=new Set(),draftSteps=[];
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('Не получилось сохранить данные в браузере. Проверь свободное место и настройки Safari.')}};
function currentItems(){return selected===nowKey()?items.filter(x=>!x.done||x.date===selected):items.filter(x=>x.date===selected)}
function fmtDate(k){const d=dateFromKey(k),same=k===nowKey();return (same?'Сегодня, ':'')+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function addTask(title,steps=[],date=selected){const t=title.trim();if(!t)return;items.unshift({id:uid(),title:t,date,done:false,steps:steps.map(s=>({title:s,done:false}))});save();render()}
function pop(node,callback){if(matchMedia('(prefers-reduced-motion: reduce)').matches){callback();return}const r=node.getBoundingClientRect();node.classList.add('pop');for(let i=0;i<7;i++){const s=el('i','spark');s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--a',i*360/7+'deg');document.body.append(s);setTimeout(()=>s.remove(),600)}setTimeout(callback,320)}
function renderWeek(){const day=dateFromKey(selected),dayOfWeek=(day.getDay()+6)%7,monday=new Date(day);monday.setDate(day.getDate()-dayOfWeek);const strip=$('weekStrip');strip.replaceChildren();const short=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const key=dateKey(d),btn=el('button','day'+(key===selected?' active':''));btn.type='button';btn.setAttribute('aria-label',d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}));btn.setAttribute('aria-pressed',String(key===selected));btn.append(el('span','',short[i]),el('b','',String(d.getDate())));btn.onclick=()=>{selected=key;panel='home';render()};strip.append(btn)}}
function renderTasks(){const host=$('tasks');host.replaceChildren();const list=currentItems(),done=list.filter(x=>x.done).length;$('counter').textContent=done+' из '+list.length;$('progressNumber').textContent=done;$('progressTotal').textContent='из '+list.length;$('progressOrb').style.setProperty('--progress',(list.length?done/list.length*100:0)+'%');$('progressOrb').setAttribute('aria-label','Выполнено '+done+' из '+list.length);
if(!list.length){const empty=el('div','empty glass');empty.append(el('strong','','Пока здесь свободно 🫧'),el('p','','Добавь маленькое дело кнопкой +'));host.append(empty);return}
for(const item of list){const card=el('article','task glass'+(item.done?' done':'')),head=el('div','taskhead'),check=el('input','check');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Вернуть дело: ':'Лопнуть пузырёк: ')+item.title);check.onchange=()=>{if(check.checked)pop(check,()=>{item.done=true;save();render()});else{item.done=false;save();render()}};const content=el('div','task-name'),title=el('span','tasktitle',item.title);content.append(title);const steps=Array.isArray(item.steps)?item.steps:(item.steps=[]);if(steps.length)content.append(el('span','task-meta',steps.length+' '+(steps.length===1?'шаг':steps.length<5?'шага':'шагов')+' · '+steps.filter(s=>s.done).length+' сделано'));
head.append(check,content);const toggle=el('button','disclosure','›');toggle.type='button';toggle.setAttribute('aria-label','Открыть шаги и действия');toggle.setAttribute('aria-expanded',String(expanded.has(item.id)));toggle.onclick=()=>{if(expanded.has(item.id))expanded.delete(item.id);else expanded.add(item.id);render()};head.append(toggle);card.append(head);
if(expanded.has(item.id)){const details=el('div','task-details');if(steps.length){const stepList=el('div','steps');for(const s of steps){const row=el('label','step'+(s.done?' finished':'')),c=el('input','check');c.type='checkbox';c.checked=!!s.done;c.setAttribute('aria-label',(s.done?'Вернуть шаг: ':'Лопнуть шаг: ')+s.title);c.onchange=()=>{if(c.checked)pop(c,()=>{s.done=true;save();render()});else{s.done=false;save();render()}};row.append(c,el('span','',s.title));stepList.append(row)}details.append(stepList)}
const actions=el('div','actions'),add=el('button','soft','＋ Добавить шаг');add.type='button';add.onclick=()=>{const old=details.querySelector('.stepform');if(old){old.remove();return}const form=el('form','stepform'),inp=el('input');inp.placeholder='Небольшой шаг';inp.required=true;inp.maxLength=150;const ok=el('button','','Добавить');ok.type='submit';form.append(inp,ok);form.onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t){steps.push({title:t,done:false});item.suggestedSteps=false;save();render()}};details.append(form);inp.focus()};actions.append(add);
if(!steps.length){const suggest=el('button','soft','✧ Помочь разбить на шаги');suggest.type='button';suggest.onclick=()=>{const t=item.title.toLowerCase();let v;if(/голов|волос|душ|мытьс/.test(t))v=['Приготовить полотенце','Собрать средства','Помыть волосы','Высушить волосы'];else if(/посуд/.test(t))v=['Подойти к раковине','Убрать лишнее','Помыть несколько предметов'];else if(/убор|прибра|комнат/.test(t))v=['Выбрать одну зону','Убрать три вещи','Протереть поверхность'];else v=['Подготовить нужное','Сделать первый шаг','Продолжить, если есть силы'];item.steps=v.map(title=>({title,done:false}));item.suggestedSteps=true;save();render()};actions.append(suggest)}
if(item.suggestedSteps&&steps.length){const undo=el('button','soft','× Убрать предложенные шаги');undo.type='button';undo.onclick=()=>{item.steps=[];item.suggestedSteps=false;save();render()};actions.append(undo)}
const del=el('button','soft','Удалить дело');del.type='button';del.onclick=()=>{if(confirm('Удалить дело «'+item.title+'»?')){items=items.filter(x=>x.id!==item.id);expanded.delete(item.id);save();render()}};actions.append(del);details.append(actions);card.append(details)}host.append(card)}
}
function renderPanel(){const box=$('quickPanel');box.replaceChildren();box.hidden=panel==='home';if(panel==='home')return;
const titles={quick:'Быстрое добавление',stats:'Маленькие победы',templates:'Знакомые дела',settings:'Данные bubble.'};box.append(el('h3','',titles[panel]));const grid=el('div','quick-grid');
const make=(text,note,onClick)=>{const b=el('button','quick-card',text);b.type='button';if(note)b.append(el('small','',note));b.onclick=onClick;grid.append(b)};
if(panel==='quick'){const past=[...items].filter(x=>x.done&&x.date!==selected),seen=new Set();past.forEach(x=>{const k=x.title.toLowerCase();if(seen.has(k)||seen.size>=4)return;seen.add(k);make(x.title,'＋ Добавить снова',()=>addTask(x.title))});if(!seen.size)box.append(el('p','','Здесь появятся часто повторяющиеся дела. Пока можно выбрать шаблон.'));make('Добавить своё','Новая задача',openModal)}
if(panel==='stats'){const total=items.length,done=items.filter(x=>x.done).length;box.append(el('p','','Всего сохранено дел: '+total+'. Выполнено: '+done+'. Без серий, штрафов и оценок — только твои маленькие победы.'))}
if(panel==='templates'){['Помыть голову','Разобрать посуду','Пройти урок QA','Сделать брелок','Полить цветы','Убраться 10 минут'].forEach(t=>make(t,'＋ Добавить',()=>addTask(t)))}
if(panel==='settings'){box.append(el('p','','Дела сохраняются на этом устройстве в хранилище браузера. Приложение с иконки iPhone может иметь отдельные данные от Safari. Сделай резервную копию, чтобы их не потерять.'));make('Скачать копию','JSON-файл',()=>{const data=new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}),url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download='bubble-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});make('Восстановить','Выбрать JSON',()=>{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files?.[0];if(!file)return;const data=JSON.parse(await file.text()),list=Array.isArray(data)?data:data.items;if(!Array.isArray(list)||!list.every(x=>x&&typeof x.title==='string'))throw Error('Invalid');if(!confirm('Восстановить '+list.length+' дел? Текущие дела будут сохранены, совпадения объединены.'))return;const byId=new Map(items.map(x=>[x.id,x]));list.forEach(x=>byId.set(x.id||uid(),x));items=[...byId.values()];save();render()}catch(e){alert('Не удалось прочитать резервную копию.')}};input.click()})}
if(grid.children.length)box.append(grid)
}
function render(){const d=dateFromKey(selected);$('dateLabel').textContent=fmtDate(selected);$('listHeading').textContent=selected===nowKey()?'Мои дела':'Дела на '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});renderWeek();renderTasks();renderPanel();document.querySelectorAll('.navbtn').forEach(b=>{const active=b.dataset.panel===panel;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;render();if(panel!=='home')$('quickPanel').scrollIntoView({behavior:'smooth',block:'nearest'})});
const backdrop=$('modalBackdrop');function renderDraft(){const host=$('draftSteps');host.replaceChildren();draftSteps.forEach((t,i)=>{const row=el('div','draft-step'),b=el('button','','×');b.type='button';b.setAttribute('aria-label','Удалить шаг');b.onclick=()=>{draftSteps.splice(i,1);renderDraft()};row.append(el('span','',t),b);host.append(row)})}
function openModal(){draftSteps=[];renderDraft();$('taskInput').value='';$('draftStepInput').value='';backdrop.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('taskInput').focus(),60)}
function closeModal(){backdrop.hidden=true;document.body.style.overflow='';$('openModal').focus()}
function addDraft(){const inp=$('draftStepInput'),v=inp.value.trim();if(v){draftSteps.push(v);inp.value='';renderDraft();inp.focus()}}
$('openModal').onclick=openModal;$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('addDraftStep').onclick=addDraft;$('draftStepInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addDraft()}};backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.hidden)closeModal()});
$('newTask').onsubmit=e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title)return;const extra=$('draftStepInput').value.trim();if(extra)draftSteps.push(extra);addTask(title,draftSteps);closeModal();panel='home';render()};
render();
})();
</script>
</body></html>
